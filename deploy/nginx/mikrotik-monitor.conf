# Docker-less deployment: system nginx reverse-proxying to a locally-run
# backend (systemd unit, gunicorn on 127.0.0.1:8000) and serving the built
# frontend from /var/www/mikrotik-monitor.
#
# Install: copy to /etc/nginx/sites-available/mikrotik-monitor.conf, then
#   sudo ln -s /etc/nginx/sites-available/mikrotik-monitor.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Start with a self-signed pair (see README), swap in certbot-issued
    # files once a real domain points at this server.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/mikrotik-monitor;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
